databases:
  - name: studentdesk-db
    databaseName: studentdesk
    user: studentdesk
    plan: free

services:
  - type: web
    name: studentdesk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: python -m gunicorn student_management.wsgi:application
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studentdesk-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
